<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserisci Previsione Meteo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Raleway:wght@700;800;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style_app.css">
    <link rel="stylesheet" href="assets/css/style_insert_forecast.css">
    <link rel="stylesheet" href="assets/css/tema.css">
    <link rel="stylesheet" href="assets/css/kit_statico.css">
</head>
<body class="bg-light">
    <!-- Intestazione. Nel sito vero è utils/header.php: qui è riscritta a mano -->
    <header class="header py-3">
        <a href="menu.html" class="btn btn-outline-primary btn-menu d-none d-md-block">☰ <span class="menu-label">Menu</span></a>
        <h1 class="site-title">WeatherChallenge ⛅</h1>
        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle" type="button"><span class="avatar">M</span>Mario Rossi</button>
        </div>
    </header>

    <div class="container pt-2 px-2">
        <h1 class="page-title text-center mb-4">Inserisci la tua Previsione Meteo</h1>

        <form id="forecastForm" method="get" action="history.html">
            <div class="mb-4">
                <label for="date" class="form-label">Data:</label>
                <input type="date" id="date" name="date" class="form-control" value="2026-10-23" required>
            </div>

            <div class="row g-3 px-2">
                <div class="col-md-8">
                    <div class="mb-4">
                        <label class="form-label">Descrizione Meteo — Mattina:</label>
                        <div class="weather-group">
                            <button type="button" class="weather-btn active" title="Soleggiato">☀️</button>
                            <button type="button" class="weather-btn" title="Parzialmente Nuvoloso">⛅</button>
                            <button type="button" class="weather-btn" title="Nuvoloso">☁️</button>
                            <button type="button" class="weather-btn" title="Pioggia">🌧️</button>
                            <button type="button" class="weather-btn" title="Neve">❄️</button>
                            <button type="button" class="weather-btn" title="Grandine">⚽</button>
                            <button type="button" class="weather-btn" title="Temporale">🌩️</button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Descrizione Meteo — Pomeriggio:</label>
                        <div class="weather-group">
                            <button type="button" class="weather-btn" title="Soleggiato">☀️</button>
                            <button type="button" class="weather-btn active" title="Parzialmente Nuvoloso">⛅</button>
                            <button type="button" class="weather-btn" title="Nuvoloso">☁️</button>
                            <button type="button" class="weather-btn" title="Pioggia">🌧️</button>
                            <button type="button" class="weather-btn" title="Neve">❄️</button>
                            <button type="button" class="weather-btn" title="Grandine">⚽</button>
                            <button type="button" class="weather-btn" title="Temporale">🌩️</button>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <button type="button" class="legend-toggle open"><span>📖 Legenda Meteo</span><span class="arrow">▼</span></button>
                    <div class="legend-card card shadow-sm visible">
                        <div class="card-header bg-secondary text-white"><h5 class="mb-0">Legenda Meteo</h5></div>
                        <div class="card-body">
                            <ul class="list-unstyled mb-0">
                                <li>☀️ Soleggiato</li>
                                <li>⛅ Parzialmente Nuvoloso</li>
                                <li>☁️ Nuvoloso</li>
                                <li>🌧️ Pioggia</li>
                                <li>❄️ Neve</li>
                                <li>⚽ Grandine (misto pioggia)</li>
                                <li>🌩️ Temporale (misto pioggia)</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="temp-row mb-4">
                <div>
                    <label for="temp_min" class="form-label text-primary"><span class="d-md-none">Temp Min (°C):</span><span class="d-none d-md-inline">Temperatura Minima (°C):</span></label>
                    <input type="number" id="temp_min" name="temp_min" step="0.1" class="form-control" value="6.5" required>
                </div>
                <div>
                    <label for="temp_max" class="form-label text-danger"><span class="d-md-none">Temp Max (°C):</span><span class="d-none d-md-inline">Temperatura Massima (°C):</span></label>
                    <input type="number" id="temp_max" name="temp_max" step="0.1" class="form-control" value="15.0" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="note" class="form-label">Nota (facoltativa):</label>
                <textarea class="form-control" id="note" name="note" rows="3" placeholder="Inserisci un'allerta meteo o una nota rilevante..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-4">Salva Previsione</button>
        </form>
    </div>


    <!-- Barra in basso: si vede solo su telefono (larghezza fino a 768px) -->
    <nav class="bottom-nav" aria-label="Navigazione">
        <a href="menu.html" class="bn-menu"><span class="bn-icon">☰</span><span>Menu</span></a>
        <div class="dropdown">
            <button class="bn-profile" type="button"><span class="avatar avatar-sm">M</span><span class="bn-label">Mario Rossi</span></button>
        </div>
    </nav>
</body>
</html>
